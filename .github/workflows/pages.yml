name: Deploy to GitHub Pages

# Two sites, one Pages deployment:
#   /        STABLE       — built from the `release` branch (from master until `release` exists).
#                           Changes only when you release: merge master into `release`.
#   /beta/   PRE-RELEASE  — built from master on every merge (APP_CHANNEL=beta: its own
#                           browser storage and a PRE-RELEASE badge; see src/platform/channel.js).
on:
  push:
    branches: [master, release]
    # Don't spend a build + deploy on a push that cannot change the built site.
    # Everything NOT listed here still triggers — including tests/, which gate the deploy,
    # and src/changelog.js, which is site content. Deliberately conservative: the cost of
    # an unnecessary run is a few minutes, the cost of a missed one is a stale deploy.
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.codegraph/**'
      - '.gitignore'
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pre-release: master, whichever branch triggered the run.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test (master)
        run: npx vitest run

      - name: Build pre-release (/beta/)
        run: APP_CHANNEL=beta npx vite build --outDir "$RUNNER_TEMP/beta"

      # Stable: the `release` branch if there is one, else master. Built in its own worktree
      # so the pre-release build above is untouched. It was tested when it was on master.
      - name: Build stable (/)
        run: |
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git worktree add "$RUNNER_TEMP/stable" origin/release
          else
            git worktree add "$RUNNER_TEMP/stable" HEAD
          fi
          cd "$RUNNER_TEMP/stable"
          npm ci
          APP_CHANNEL=stable npx vite build --outDir "$GITHUB_WORKSPACE/dist"

      - name: Put the pre-release under /beta/
        run: cp -r "$RUNNER_TEMP/beta" dist/beta

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
